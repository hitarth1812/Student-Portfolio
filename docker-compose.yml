# Student Portfolio + Task Manager stack (Practical 11)
#   docker compose up -d --build     build images and start everything
#   docker compose ps                status + health of each container
#   docker compose logs -f backend   follow one service's logs
#   docker compose down              stop (add -v to also drop the database volume)
name: awdf-student-portfolio

services:
  mongodb:
    image: mongo:7.0
    container_name: awdf-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: task-manager
    # 27018 on the host so it never collides with a locally installed MongoDB on 27017
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend-net

  backend:
    build:
      context: ./task-manager-api
    image: awdf-task-manager-api:1.0
    container_name: awdf-backend
    restart: unless-stopped
    # JWT_SECRET / JWT_EXPIRES_IN come from the API's own .env (never baked into the image)
    env_file:
      - ./task-manager-api/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Service name "mongodb" resolves through Compose's internal DNS
      MONGO_URI: mongodb://mongodb:27017/task-manager
      CACHE_TTL: 60
      JOB_CONCURRENCY: 2
    ports:
      - "5000:5000"
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ./Student_Portfolio
      args:
        VITE_API_URL: /backend
    image: awdf-student-portfolio-web:1.0
    container_name: awdf-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

volumes:
  mongo-data:
  backend-logs:

# The frontend can reach the API but not the database: only the backend sits on both networks
networks:
  backend-net:
  frontend-net:
